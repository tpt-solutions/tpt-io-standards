[package]
name = "tpt-io-nifti"
description = "NIfTI-1 / NIfTI-2 neuroimaging parser: headers, affine transforms, multi-dim arrays."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["nifti", "neuroimaging", "parser"]
categories = ["parser-implementations", "science"]

[lib]
name = "tpt_io_nifti"

[dependencies]
tpt-io-core = { workspace = true }
flate2 = { version = "1", optional = true }

[features]
default = ["std"]
std = ["tpt-io-core/std"]
alloc = ["tpt-io-core/alloc"]
# Integration with future `tpt-sci-image` (not yet published).
sci-image-integration = []
# Gzip decompression for `.nii.gz` (requires `std`).
gzip = ["flate2", "std"]

[dev-dependencies]
proptest = "1"
