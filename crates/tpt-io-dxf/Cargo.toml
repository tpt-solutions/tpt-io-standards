[package]
name = "tpt-io-dxf"
description = "AutoCAD DXF (ASCII) reader and writer: layers, lines, circles, polylines and text entities."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["dxf", "cad", "autocad", "parser"]
categories = ["parser-implementations"]

[lib]
name = "tpt_io_dxf"

[dependencies]
tpt-io-core = { workspace = true }

[features]
default = ["std"]
std = ["tpt-io-core/std"]
alloc = ["tpt-io-core/alloc"]
