[package]
name = "tpt-io-ifc"
description = "IFC 4.0 / 4.3 (STEP-Physical File) parser for Building Information Modeling."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["ifc", "bim", "construction", "parser"]
categories = ["parser-implementations", "science"]

[lib]
name = "tpt_io_ifc"

[dependencies]
tpt-io-core = { workspace = true }

[features]
default = ["std"]
std = ["tpt-io-core/std"]
alloc = ["tpt-io-core/alloc"]
# Integration with future `tpt-eng-geometry` (not yet published).
eng-geometry-integration = []
# Integration with future `tpt-eng-cad` (not yet published).
eng-cad-integration = []

[dev-dependencies]
