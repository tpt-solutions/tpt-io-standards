[package]
name = "tpt-io-mtconnect"
description = "MTConnect XML reader: device models (components and data items) and observation streams."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["mtconnect", "manufacturing", "cnc", "parser"]
categories = ["parser-implementations"]

[lib]
name = "tpt_io_mtconnect"

[dependencies]
tpt-io-core = { workspace = true }

[features]
default = ["std"]
std = ["tpt-io-core/std"]
alloc = ["tpt-io-core/alloc"]
