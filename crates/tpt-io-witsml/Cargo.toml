[package]
name = "tpt-io-witsml"
description = "WITSML well-trajectory reader (XML): trajectory identity and survey stations (measured depth, inclination, azimuth)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["witsml", "oil-gas", "drilling", "parser"]
categories = ["parser-implementations"]

[lib]
name = "tpt_io_witsml"

[dependencies]
tpt-io-core = { workspace = true }

[features]
default = ["std"]
std = ["tpt-io-core/std"]
alloc = ["tpt-io-core/alloc"]
