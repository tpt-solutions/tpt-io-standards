[package]
name = "tpt-io-netcdf"
description = "NetCDF-3 classic parser for climate/ocean/atmospheric data (header, dims, vars, attrs)."

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["netcdf", "hdf5", "earth", "parser"]
categories = ["parser-implementations", "science"]

[lib]
name = "tpt_io_netcdf"

[dependencies]
tpt-io-core = { workspace = true }
# NetCDF-4 files are HDF5 files; the reader lives in `tpt-io-hdf5`.
tpt-io-hdf5 = { workspace = true }

[features]
default = ["std"]
std = ["tpt-io-core/std", "tpt-io-hdf5/std"]
alloc = ["tpt-io-core/alloc", "tpt-io-hdf5/alloc"]
# Integration with future `tpt-sci-grid` (not yet published).
sci-grid-integration = []

[dev-dependencies]
proptest = "1"
