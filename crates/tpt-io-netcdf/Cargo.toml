[package]
name = "tpt-io-netcdf"
description = "NetCDF-3 classic parser for climate/ocean/atmospheric data (header, dims, vars, attrs)."

version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["netcdf", "hdf5", "earth", "parser"]
categories = ["parser-implementations", "science"]

[lib]
name = "tpt_io_netcdf"

[dependencies]
tpt-io-core = { workspace = true }
flate2 = { version = "1.1", optional = true }

[features]
default = ["std"]
# `flate2`'s reader API is std-only, so deflate decoding needs `std`.
std = ["tpt-io-core/std", "dep:flate2"]
alloc = ["tpt-io-core/alloc"]
# Integration with future `tpt-sci-grid` (not yet published).
sci-grid-integration = []

[dev-dependencies]
proptest = "1"
