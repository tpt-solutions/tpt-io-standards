[package]
name = "tpt-io-hl7v2"
description = "HL7 v2.x pipe-delimited message reader and writer: segments, fields, components and encoding characters."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["hl7", "healthcare", "messaging", "parser"]
categories = ["parser-implementations"]

[lib]
name = "tpt_io_hl7v2"

[dependencies]
tpt-io-core = { workspace = true }

[features]
default = ["std"]
std = ["tpt-io-core/std"]
alloc = ["tpt-io-core/alloc"]
