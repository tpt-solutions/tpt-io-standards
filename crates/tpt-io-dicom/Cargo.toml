[package]
name = "tpt-io-dicom"
description = "DICOM (PS3.5/6/7/10) parser: explicit/implicit VR, pixel data, tag dictionary, anonymization."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["dicom", "medical-imaging", "parser"]
categories = ["parser-implementations", "science"]

[lib]
name = "tpt_io_dicom"

[dependencies]
tpt-io-core = { workspace = true }

[features]
default = ["std"]
std = ["tpt-io-core/std"]
alloc = ["tpt-io-core/alloc"]
# Integration with future `tpt-sci-image` (not yet published).
sci-image-integration = []

[dev-dependencies]
proptest = "1.4"
