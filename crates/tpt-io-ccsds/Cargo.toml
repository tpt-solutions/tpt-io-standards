[package]
name = "tpt-io-ccsds"
description = "CCSDS orbit data messages: OEM ephemerides (read and write), OPM and TDM (read) in KVN form."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["ccsds", "orbit", "ephemeris", "space", "parser"]
categories = ["parser-implementations", "science"]

[lib]
name = "tpt_io_ccsds"

[dependencies]
tpt-io-core = { workspace = true }

[features]
default = ["std"]
std = ["tpt-io-core/std"]
alloc = ["tpt-io-core/alloc"]
