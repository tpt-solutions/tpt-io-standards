[package]
name = "tpt-io-geo-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tpt-io-geo = { path = ".." }

[[bin]]
name = "geojson"
path = "fuzz_targets/geojson.rs"
test = false
doc = false

[[bin]]
name = "geotiff"
path = "fuzz_targets/geotiff.rs"
test = false
doc = false

[[bin]]
name = "shapefile"
path = "fuzz_targets/shapefile.rs"
test = false
doc = false
