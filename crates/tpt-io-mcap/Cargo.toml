[package]
name = "tpt-io-mcap"
description = "MCAP robotics log reader and writer: schemas, channels, messages and uncompressed chunks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["mcap", "robotics", "log", "parser"]
categories = ["parser-implementations"]

[lib]
name = "tpt_io_mcap"

[dependencies]
tpt-io-core = { workspace = true }

[features]
default = ["std"]
std = ["tpt-io-core/std"]
alloc = ["tpt-io-core/alloc"]
