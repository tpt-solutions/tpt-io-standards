[package]
name = "tpt-io"
description = "Umbrella crate re-exporting every tpt-io format parser behind opt-in features"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["parser", "io", "format", "umbrella"]
categories = ["parser-implementations"]

[lib]
name = "tpt_io"

[dependencies]
tpt-io-core = { workspace = true }
tpt-io-dicom = { workspace = true, optional = true }
