[package]
name = "tpt-io-arxml"
description = "AUTOSAR ARXML reader: package hierarchy, short names and element inventory."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["autosar", "arxml", "automotive", "parser"]
categories = ["parser-implementations"]

[lib]
name = "tpt_io_arxml"

[dependencies]
tpt-io-core = { workspace = true }

[features]
default = ["std"]
std = ["tpt-io-core/std"]
alloc = ["tpt-io-core/alloc"]
