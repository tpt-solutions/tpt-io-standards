[package]
name = "tpt-io-asterix"
description = "ASTERIX surveillance data reader (Eurocontrol): data block framing, FSPEC decoding, and a CAT048 field subset."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["asterix", "eurocontrol", "surveillance", "aviation", "parser"]
categories = ["parser-implementations"]

[lib]
name = "tpt_io_asterix"

[dependencies]
tpt-io-core = { workspace = true }

[features]
default = ["std"]
std = ["tpt-io-core/std"]
alloc = ["tpt-io-core/alloc"]
