[package]
name = "tpt-io-fhir"
description = "HL7 FHIR R4/R5 deserializer for JSON and XML representations with profile validation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["fhir", "hl7", "health", "parser"]
categories = ["parser-implementations", "science"]

[lib]
name = "tpt_io_fhir"

[dependencies]
tpt-io-core = { workspace = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
quick-xml = { version = "0.37", features = ["serialize"], optional = true }

[features]
default = ["std", "json", "xml", "validation", "reference", "bundle", "fhirpath", "batch"]
std = ["tpt-io-core/std", "serde", "serde_json"]
alloc = ["tpt-io-core/alloc"]
# JSON deserialization (requires `alloc` for `String`/`Vec`).
json = ["serde", "serde_json", "alloc"]
# XML deserialization (requires `std`).
xml = ["quick-xml", "std"]
# FHIR profile + HIPC compliance validation.
validation = ["alloc"]
# Reference resolution, bundle traversal, FHIRPath, batch.
reference = ["alloc"]
bundle = ["alloc"]
fhirpath = ["alloc"]
batch = ["alloc"]
# Integration with future `tpt-medical-patient` (not yet published).
medical-patient-integration = []

[dev-dependencies]
proptest = "1"
serde_json = "1"
quick-xml = { version = "0.37", features = ["serialize"] }
