[package]
name = "tpt-io-core"
description = "Shared foundation traits, error types, and byte-stream utilities for the tpt-io format parser workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["parser", "io", "no-std", "schema"]
categories = ["parser-implementations", "no-std"]

[lib]
name = "tpt_io_core"

[dependencies]
crc32fast = { workspace = true, optional = true }
md-5 = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[features]
default = ["std"]
std = ["alloc"]
alloc = []
checksums = ["dep:crc32fast", "dep:md-5", "dep:sha2"]
zip = ["checksums"]

[dev-dependencies]
