[package]
name = "tpt-io-rosbag"
description = "ROS 1 bag (version 2.0) reader and writer: connections, messages and uncompressed chunks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["ros", "rosbag", "robotics", "parser"]
categories = ["parser-implementations"]

[lib]
name = "tpt_io_rosbag"

[dependencies]
tpt-io-core = { workspace = true }

[features]
default = ["std"]
std = ["tpt-io-core/std"]
alloc = ["tpt-io-core/alloc"]
