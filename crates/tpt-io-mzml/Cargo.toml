[package]
name = "tpt-io-mzml"
description = "mzML mass spectrometry reader: spectra with m/z and intensity arrays decoded from base64 (32- and 64-bit, uncompressed)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["mzml", "mass-spectrometry", "proteomics", "parser"]
categories = ["parser-implementations", "science"]

[lib]
name = "tpt_io_mzml"

[dependencies]
tpt-io-core = { workspace = true }

[features]
default = ["std"]
std = ["tpt-io-core/std"]
alloc = ["tpt-io-core/alloc"]
