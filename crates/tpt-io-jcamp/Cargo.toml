[package]
name = "tpt-io-jcamp"
description = "JCAMP-DX spectroscopy files: labelled header and XY data (XYDATA and XYPOINTS), with a writer."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["jcamp", "spectroscopy", "ir", "nmr", "parser"]
categories = ["parser-implementations", "science"]

[lib]
name = "tpt_io_jcamp"

[dependencies]
tpt-io-core = { workspace = true }

[features]
default = ["std"]
std = ["tpt-io-core/std"]
alloc = ["tpt-io-core/alloc"]
