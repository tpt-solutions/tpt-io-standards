[package]
name = "tpt-io-spice"
description = "SPICE netlist parser for HSPICE / LTSpice / Ngspice / PSpice dialects."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["spice", "circuit", "electronics", "parser"]
categories = ["parser-implementations", "science"]

[lib]
name = "tpt_io_spice"

[dependencies]
tpt-io-core = { workspace = true }

[features]
default = ["std"]
std = ["tpt-io-core/std"]
alloc = ["tpt-io-core/alloc"]
# Integration with future `tpt-em-circuit` (not yet published).
em-circuit-integration = []

[dev-dependencies]
proptest = "1"
