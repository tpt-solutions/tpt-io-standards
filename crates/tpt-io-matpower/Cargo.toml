[package]
name = "tpt-io-matpower"
description = "MATPOWER case file reader and writer: bus, generator and branch data for power-flow studies."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["matpower", "power-flow", "grid", "parser"]
categories = ["parser-implementations", "science"]

[lib]
name = "tpt_io_matpower"

[dependencies]
tpt-io-core = { workspace = true }

[features]
default = ["std"]
std = ["tpt-io-core/std"]
alloc = ["tpt-io-core/alloc"]
