[package]
name = "tpt-io-gbxml"
description = "gbXML building-energy model reader: campuses, buildings, spaces and surfaces with their polyloop coordinates (read only)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["gbxml", "energy", "building", "parser"]
categories = ["parser-implementations"]

[lib]
name = "tpt_io_gbxml"

[dependencies]
tpt-io-core = { workspace = true }

[features]
default = ["std"]
std = ["tpt-io-core/std"]
alloc = ["tpt-io-core/alloc"]
