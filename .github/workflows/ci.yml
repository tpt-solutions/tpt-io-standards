name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  # Lint, build, and test across the meaningful feature configurations.
  #
  # - default features: every crate (domain crates pull in `std` + `alloc`)
  # - all features: every domain feature enabled (umbrella pulls them all in)
  # - minimal (no std/alloc): only the crates that genuinely support a
  #   no-`alloc` `no_std` build — `tpt-io-core` and the zero-cost `tpt-io`
  #   umbrella (no domain features). Domain crates require `alloc` (no `std`),
  #   so they are checked in the alloc-only step below.
  test:
    name: lint + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy (default)
        run: cargo clippy --workspace --all-targets

      - name: clippy (all-features)
        run: cargo clippy --workspace --all-targets --all-features

      - name: build + test (default)
        run: cargo test --workspace

      - name: build + test (all-features)
        run: cargo test --workspace --all-features

      - name: minimal zero-cost (no std/alloc)
        run: |
          cargo build -p tpt-io-core --no-default-features
          cargo build -p tpt-io --no-default-features

      - name: alloc-only build (every domain crate)
        run: |
          for c in tpt-io-aas tpt-io-aixm tpt-io-arxml tpt-io-asterix tpt-io-automationml \
                  tpt-io-bcf tpt-io-capeopen tpt-io-ccsds tpt-io-cda tpt-io-cellml \
                  tpt-io-chem tpt-io-chemfile tpt-io-cif tpt-io-citygml tpt-io-dexpi \
                  tpt-io-dicom tpt-io-dxf tpt-io-edf tpt-io-edif tpt-io-epanet \
                  tpt-io-fhir tpt-io-fits tpt-io-gbxml tpt-io-gcode tpt-io-gds \
                  tpt-io-geo tpt-io-gerber tpt-io-gnss tpt-io-grib tpt-io-gridlabd \
                  tpt-io-hdf5 tpt-io-hecras tpt-io-hl7v2 tpt-io-ifc tpt-io-ipc2581 \
                  tpt-io-jcamp tpt-io-kicad tpt-io-landxml tpt-io-matpower tpt-io-mcap \
                  tpt-io-mdf tpt-io-mesh tpt-io-mtconnect tpt-io-mzml tpt-io-naif \
                  tpt-io-netcdf tpt-io-nifti tpt-io-nrrd tpt-io-ome tpt-io-omex \
                  tpt-io-opcua tpt-io-opendrive tpt-io-opendss tpt-io-openehr \
                  tpt-io-openscenario tpt-io-pdb tpt-io-plcopen tpt-io-pointcloud \
                  tpt-io-rosbag tpt-io-s57 tpt-io-sbml tpt-io-segy tpt-io-spice tpt-io-threemf \
                  tpt-io-tiff tpt-io-tle tpt-io-touchstone tpt-io-urdf tpt-io-verilog \
                  tpt-io-waterml tpt-io-welllog tpt-io-witsml; do
            cargo build -p "$c" --no-default-features --features alloc
          done

  # Verify the MSRV declared in [workspace.package] actually compiles.
  msrv:
    name: msrv (1.75)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - uses: Swatinem/rust-cache@v2
      - name: build (default features)
        run: cargo build --workspace
      - name: build (all features)
        run: cargo build --workspace --all-features

  # CAPE-OPEN COM interop is Windows-only. The default (no-`com`) build is
  # covered by the `test` job on Linux/macOS; this job validates the `com`
  # feature against the real `windows` crate on a Windows runner.
  windows-com:
    name: windows COM feature
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt -p tpt-io-capeopen -- --check
      - name: clippy (com feature)
        run: cargo clippy -p tpt-io-capeopen --features com -- -Dwarnings
      - name: build + test (com feature)
        run: cargo test -p tpt-io-capeopen --features com
      - name: build (default, no com)
        run: cargo build -p tpt-io-capeopen
